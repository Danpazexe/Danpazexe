<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Daniel Paz — Founder da PazConcept, designer e desenvolvedor full-stack">
  <title>Daniel Paz — Founder da PazConcept, designer e desenvolvedor full-stack</title>
  <defs>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d1117" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="b1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="0.85" cy="1" r="0.55">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nome" x1="0" x2="1">
      <stop offset="0" stop-color="#1f2328"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="borda"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
    .papel { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #59636e; opacity: 0; }
    .papel.primeiro { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .papel, .papel.primeiro { animation: papel 12s infinite backwards; }
    }
    @keyframes papel {
      0% { opacity: 0; transform: translateY(6px); }
      3.00% { opacity: 1; transform: translateY(0); }
      22.00% { opacity: 1; transform: translateY(0); }
      25.00%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .linha { animation: entra 0.5s ease-out backwards; }
    @keyframes entra { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
    .pulso { animation: pulso 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .cursor { animation: pisca 1.1s steps(1) infinite; }
    @keyframes pisca { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .linha, .pulso, .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#borda)">
    <rect width="1200" height="320" fill="#ffffff"/>
    <rect width="1200" height="320" fill="url(#grade)"/>
    <rect width="1200" height="320" fill="url(#b1)"/>
    <rect width="1200" height="320" fill="url(#b2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#d1d9e0"/>

  <text x="64" y="92" class="mono" fill="#6d28d9" letter-spacing="2">PAZCONCEPT · DESIGN + CÓDIGO</text>
  <text x="62" y="160" class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#nome)">Daniel Paz</text>
  <text class="papel primeiro" style="animation-delay:0s" x="64" y="214">Founder &amp; Brand Designer</text><text class="papel" style="animation-delay:3s" x="64" y="214">Full-stack · Next.js + TypeScript</text><text class="papel" style="animation-delay:6s" x="64" y="214">Mobile · React Native</text><text class="papel" style="animation-delay:9s" x="64" y="214">SaaS B2B em produção</text>
  <text x="64" y="262" class="sans" font-size="15" fill="#818b98">Do branding ao deploy: identidade visual, produto e código no mesmo lugar.</text>

  <g>
    <rect x="712" y="56" width="424" height="228" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
    <circle cx="736" cy="80" r="5" fill="#ff5f57"/><circle cx="752" cy="80" r="5" fill="#febc2e"/><circle cx="768" cy="80" r="5" fill="#28c840"/>
    <text x="1112" y="85" class="mono" font-size="12" fill="#818b98" text-anchor="end">~/producao</text>
    <line x1="712" x2="1136" y1="98" y2="98" stroke="#d1d9e0"/>
    
    <g class="linha" style="animation-delay:0.40s">
      <circle class="pulso" style="animation-delay:0.0s" cx="742" cy="123" r="4" fill="#1a7f37"/>
      <text x="758" y="128" class="mono" fill="#1f2328">PitSpace</text>
      <text x="868" y="128" class="mono" fill="#818b98">pitspace.pazconcept.com.br</text>
    </g>
    <g class="linha" style="animation-delay:0.65s">
      <circle class="pulso" style="animation-delay:0.4s" cx="742" cy="153" r="4" fill="#1a7f37"/>
      <text x="758" y="158" class="mono" fill="#1f2328">DietSpace</text>
      <text x="868" y="158" class="mono" fill="#818b98">dietspace.com.br</text>
    </g>
    <g class="linha" style="animation-delay:0.90s">
      <circle class="pulso" style="animation-delay:0.8s" cx="742" cy="183" r="4" fill="#1a7f37"/>
      <text x="758" y="188" class="mono" fill="#1f2328">ElaraSpace</text>
      <text x="868" y="188" class="mono" fill="#818b98">elaraspace.pazconcept.com.br</text>
    </g>
    <g class="linha" style="animation-delay:1.15s">
      <circle class="pulso" style="animation-delay:1.2s" cx="742" cy="213" r="4" fill="#1a7f37"/>
      <text x="758" y="218" class="mono" fill="#1f2328">PerformX</text>
      <text x="868" y="218" class="mono" fill="#818b98">performx.pazconcept.com.br</text>
    </g>
    <g class="linha" style="animation-delay:1.40s">
      <circle class="pulso" style="animation-delay:1.6s" cx="742" cy="243" r="4" fill="#1a7f37"/>
      <text x="758" y="248" class="mono" fill="#1f2328">PazConcept</text>
      <text x="868" y="248" class="mono" fill="#818b98">pazconcept.com.br</text>
    </g>
    <text x="736" y="282" class="mono" fill="#818b98">$ <tspan class="cursor" fill="#1f2328">▍</tspan></text>
  </g>
</svg>
